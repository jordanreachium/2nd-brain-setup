[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify"
version = "0.1.0"
description = "Per-brain knowledge-graph builder for the brains starter kit"
requires-python = ">=3.9"
dependencies = [
    "networkx",
]

[tool.setuptools]
package-dir = {"graphify" = "."}
packages = ["graphify"]
